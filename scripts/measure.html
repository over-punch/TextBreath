<!DOCTYPE html>
<!-- Measurement page for scripts/measure.mjs — one Merriweather paragraph at a fixed width, so the
     numbers quoted in the README (per-line wave samples, line-width swing, frame cost) come from the
     shipped dist/core.js running in a real browser. -->
<html lang="en">
<head>
	<meta charset="utf-8" />
	<style>
		@font-face {
			font-family: "Merriweather";
			src: url("/site/public/fonts/Merriweather.woff2") format("woff2");
			font-weight: 300 900;
			font-display: block;
		}
		body { margin: 24px; background: #fff; }
		.para {
			width: 600px;
			font-family: "Merriweather", serif;
			font-size: 18px;
			line-height: 1.8;
			margin: 0 0 24px;
		}
	</style>
</head>
<body>
	<div id="root"></div>
</body>
</html>
