<!doctype html>
<!-- textBreath/framer/sim.html — Framer-less simulator for the TextBreath code component.
     Renders the REAL src/framer/TextBreath.tsx (transpiled to TextBreath.sim.mjs) in a plain
     browser, with the "framer" import mapped to a local shim and React from esm.sh. This proves
     the component's runtime logic (rendering, applyBreathe/startBreathe, RenderTarget gating) outside Framer.
     Build step: npx esbuild src/framer/TextBreath.tsx --loader:.tsx=tsx --format=esm
       --jsx=automatic --jsx-import-source=react --outfile=framer/TextBreath.sim.mjs -->
<html lang="en">
<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<title>TextBreath — Framer component simulator</title>
	<link rel="preconnect" href="https://fonts.googleapis.com" />
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
	<link href="https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wght@8..144,100..1000&display=swap" rel="stylesheet" />
	<style>
		body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #0e0e12; color: #f4f4f6; padding: 4rem 6vw; }
		#root { width: 100%; max-width: 30ch; }
		.note { position: fixed; bottom: 1rem; left: 0; right: 0; text-align: center; font: 0.8rem system-ui; opacity: 0.5; }
	</style>
	<script type="importmap">
	{
		"imports": {
			"react": "https://esm.sh/react@18",
			"react/jsx-runtime": "https://esm.sh/react@18/jsx-runtime",
			"react-dom/client": "https://esm.sh/react-dom@18/client",
			"framer": "./framer-shim.js"
		}
	}
	</script>
</head>
<body>
	<div id="root"></div>
	<p class="note">Simulating the Framer code component in a plain browser — RenderTarget shimmed to 'preview'.</p>
	<script type="module">
		import React from "react"
		import { createRoot } from "react-dom/client"
		import TextBreath from "./TextBreath.sim.mjs"
		createRoot(document.getElementById("root")).render(
			React.createElement(TextBreath, {
				text: "Every paragraph draws a breath, each line rising and falling a beat behind the last.",
				fontFamily: "Roboto Flex",
				fontSize: 40,
				color: "#f4f4f6",
				axis: "wght",
				amplitude: 0.45,
				period: 3.5,
				waveShape: "sine",
				mode: "phase",
				phaseOffset: 0.785,
				direction: "down",
				lineDetection: "bcr",
				linePreservation: "none",
				pauseOffscreen: true,
				cancelOffscreen: false,
			})
		)
	</script>
</body>
</html>
